name: Pinpix
options:
  bundleIdPrefix: app.pinpix
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # 上架前請填入你的 Apple Developer Team ID
    DEVELOPMENT_TEAM: ""
targets:
  Pinpix:
    type: application
    platform: macOS
    sources:
      - path: Pinpix
    info:
      path: Pinpix/Info.plist
      properties:
        CFBundleDisplayName: Pinpix
        CFBundleName: Pinpix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Pinpix"
    entitlements:
      path: Pinpix/Pinpix.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.assets.pictures.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pinpix.mac
        PRODUCT_NAME: Pinpix
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
